<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Emergency QR</title><style>body{font-family:Arial;background:#eef3f8;text-align:center}.box{max-width:520px;margin:45px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 25px #0001}.qr{width:300px;max-width:90%;margin:20px auto}.btn{display:inline-block;background:#1769aa;color:white;padding:11px 17px;border-radius:7px;text-decoration:none;margin:5px}</style></head><body><div class="box"><h1>My Emergency QR</h1><p>{{ patient.name }}</p><img class="qr" src="{{ url_for('qr_png', token=patient.qr_token) }}" alt="Emergency QR code"><p>Scan this QR code to open the emergency medical profile.</p><a class="btn" href="{{ url_for('emergency', token=patient.qr_token) }}">Test Emergency Page</a><a class="btn" href="{{ url_for('patient_dashboard') }}">Back to Dashboard</a></div></body></html>
