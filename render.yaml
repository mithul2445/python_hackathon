services:
  - type: web
    name: python_hackathon
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: python_hackathon_db
          property: connectionString

databases:
  - name: python_hackathon_db
    plan: free
