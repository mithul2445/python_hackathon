services:
  - type: web
    name: emergency-medical-qr-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: emergency-medical-qr-v2-db
          property: connectionString

databases:
  - name: emergency-medical-qr-v2-db
    plan: free
