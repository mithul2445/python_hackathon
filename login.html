<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ role|capitalize }} Login</title><style>body{font-family:Arial;background:#eef3f8}.box{max-width:420px;margin:70px auto;background:white;padding:32px;border-radius:15px;box-shadow:0 5px 25px #0001}label{display:block;margin:16px 0 7px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:7px;box-sizing:border-box}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:#1769aa;color:white;font-size:16px}.error{background:#fdecec;color:#a71919;padding:10px;border-radius:7px}.back{display:block;text-align:center;margin-top:18px;color:#1769aa}</style></head><body><div class="box"><h1>{{ role|capitalize }} Login</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="error">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>{{ role|capitalize }} ID</label><input name="identifier" required><label>Password</label><input type="password" name="password" required><button type="submit">Sign In</button></form><a class="back" href="{{ url_for('index') }}">← Back to home</a><p style="text-align:center;color:#667085">Demo: {% if role=='patient' %}P1001 / Patient@123{% else %}D1001 / Doctor@123{% endif %}</p></div></body></html>
